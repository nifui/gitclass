[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "0.21.1"
redis = {version = "1.7.1", optional = true}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
sqlx = {version = "0.9.0", features = ["postgres", "uuid", "time", "json"]}
time = {version = "0.3.55", features = ["serde"]}
tokio = {version = "1.53.2", features = ["full"]}
toml = "1.1.6"

[features]
default = []
redis = ["dep:redis"]
