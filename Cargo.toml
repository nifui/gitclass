[workspace]
resolver = "3"
members = ["runner", "backend", "task_queue"]

[workspace.dependencies]

time = {version = "0.3.55", features = ["serde"]}
tokio = {version = "1.53.1", features = ["full"]}
tracing = "0.1.44"
thiserror = "2.0.20"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
sqlx = {version = "0.9.0", features = ["ipnetwork", "time", "uuid", "runtime-tokio", "postgres", "json", "tls-rustls-aws-lc-rs"]}
uuid = {version = "1.26.1", features = ["v4", "v7", "serde"]}
